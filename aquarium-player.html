<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061723">
<title>Aquarium Player · Ison Home</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#04111b;color:#eef8f8;--glass:rgba(8,24,34,.72);--line:rgba(220,246,248,.2);--teal:#a9e8e5;--gold:#f6d49a}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03101b}
button,a,input{font:inherit}
button,a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffe3a8;outline-offset:3px}
#reef{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 54%,#15799a 0,#064768 52%,#021721 100%)}
#reef img{position:absolute;inset:-2.2%;width:104.4%;height:104.4%;object-fit:cover;object-position:center;transform:scale(1.015);animation:reef-drift 260s ease-in-out infinite alternate;filter:saturate(.93) contrast(1.03)}
#reef:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,14,25,.1),transparent 24%,transparent 68%,rgba(0,10,18,.22));pointer-events:none}
#fishCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes reef-drift{from{transform:scale(1.015) translate3d(-.2%,0,0)}to{transform:scale(1.075) translate3d(.45%,-.35%,0)}}
#ambientHint{position:fixed;left:50%;bottom:5vh;transform:translate(-50%,10px);padding:10px 16px;border:1px solid rgba(231,251,250,.2);border-radius:99px;background:rgba(2,18,28,.48);backdrop-filter:blur(14px);color:rgba(242,253,251,.83);font-size:clamp(12px,1vw,16px);letter-spacing:.02em;opacity:1;transition:opacity .8s,transform .8s;white-space:nowrap}
body.controls-visible #ambientHint{opacity:0;transform:translate(-50%,10px)}
#controls{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3vw,48px);background:linear-gradient(180deg,rgba(1,11,18,.34),transparent 33%,transparent 62%,rgba(1,10,16,.34));opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;pointer-events:none}
body.controls-visible #controls{opacity:1;visibility:visible;pointer-events:none}
.topbar,.bottomBar{display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
.brand,.controlGroup{display:flex;align-items:center;gap:10px}
.brandMark{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(220,246,248,.28);border-radius:50%;background:rgba(4,24,34,.6);backdrop-filter:blur(16px);color:var(--teal)}
.brandMark svg{width:21px;height:21px}
.brandName{display:block;font-size:clamp(13px,1.05vw,17px);font-weight:720;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 10px #00131a}
.brandSub{display:block;font-size:11px;letter-spacing:.09em;color:rgba(235,248,248,.7);margin-top:3px}
.controlGroup{pointer-events:auto}
.pill,.iconButton,.actionButton{border:1px solid rgba(234,250,249,.23);background:rgba(4,23,34,.68);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.16);transition:background .18s,border-color .18s,transform .18s}
.pill{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 15px;border-radius:99px;color:rgba(242,250,250,.85);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.liveDot{width:7px;height:7px;border-radius:50%;background:#9ee4d2;box-shadow:0 0 13px #87dec2}
.iconButton{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;cursor:pointer}
.iconButton svg{width:19px;height:19px}
.actionButton{min-height:44px;padding:0 17px;border-radius:99px;cursor:pointer;font-weight:650;font-size:14px}
.iconButton:hover,.actionButton:hover{background:rgba(12,48,60,.88);border-color:rgba(213,247,245,.54);transform:translateY(-1px)}
.actionButton.primary{color:#072028;background:rgba(190,238,230,.93);border-color:rgba(222,250,245,.86)}
.actionButton.primary:hover{background:#e1fff7}
.bottomBar{align-items:end}
.panel{pointer-events:auto;display:flex;align-items:center;gap:clamp(12px,2vw,24px);padding:13px 15px;border:1px solid rgba(229,248,247,.22);border-radius:18px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 20px 65px rgba(0,0,0,.24)}
.settingLabel{display:flex;flex-direction:column;gap:4px;min-width:118px}
.settingLabel strong{font-size:13px;font-weight:660}
.settingLabel span{font-size:11px;color:rgba(225,244,243,.69)}
.rangeWrap{display:flex;align-items:center;gap:11px;min-width:clamp(170px,22vw,290px)}
input[type=range]{width:100%;accent-color:#a8e5dc;cursor:pointer}
#fishCount{min-width:22px;text-align:right;font-size:14px;font-weight:700;color:#e4f9f2}
.separator{width:1px;height:30px;background:rgba(232,250,249,.16)}
.subtle{color:rgba(234,247,247,.76);font-size:12px}
#settingsPanel{display:flex;align-items:center;gap:12px}
#settingsPanel[hidden]{display:none}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:11px 16px;border:1px solid rgba(234,250,249,.19);border-radius:99px;background:rgba(3,20,29,.66);backdrop-filter:blur(14px);font-size:13px;color:#effbf8;opacity:0;pointer-events:none;transition:opacity .2s}
#status.show{opacity:1}
@media(max-width:740px){#controls{padding:14px}.brandSub,.pill{display:none}.bottomBar{align-items:stretch;flex-direction:column}.bottomBar>.controlGroup{align-self:flex-end}.panel{width:100%;flex-wrap:wrap;border-radius:15px}.settingLabel{min-width:92px}.rangeWrap{flex:1;min-width:150px}.separator{display:none}}
@media(prefers-reduced-motion:reduce){#reef img{animation:none}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="reef" aria-label="Full-screen aquarium scene">
<img src="./reef-v2/reef.webp" alt="" fetchpriority="high">
<canvas id="fishCanvas" aria-hidden="true"></canvas>
</main>
<div id="ambientHint">Press OK or any key for aquarium controls</div>
<div id="status" role="status" aria-live="polite"></div>
<section id="controls" aria-label="Aquarium controls">
<div class="topbar">
<a class="brand" href="screensaver-player.html" aria-label="Back to Screensaver Player">
<span class="brandMark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12c3.1-4.1 6.1-6.1 9-6.1s5.9 2 9 6.1c-3.1 4.1-6.1 6.1-9 6.1S6.1 16.1 3 12Z" stroke="currentColor" stroke-width="1.5"/><path d="M8 12c1.4-1.3 2.7-1.9 4-1.9s2.6.6 4 1.9c-1.4 1.3-2.7 1.9-4 1.9S9.4 13.3 8 12Z" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="#06202a"/></svg></span>
<span><span class="brandName">Aquarium Player</span><span class="brandSub">ISON HOME · AMBIENT SCENE</span></span>
</a>
<div class="controlGroup">
<span class="pill"><span class="liveDot"></span>Live scene</span>
<button class="iconButton" id="fullBtn" type="button" aria-label="Enter full screen" title="Full screen">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/></svg>
</button>
</div>
</div>
<div class="bottomBar">
<div class="panel" id="settingsPanel">
<div class="settingLabel"><strong>Animated fish</strong><span>Additional swimmers</span></div>
<div class="rangeWrap"><input id="fishSlider" type="range" min="0" max="16" step="1" value="8" aria-label="Number of additional fish"><output id="fishCount" for="fishSlider">8</output></div>
<div class="separator"></div>
<span class="subtle">A gentle pace, built for big screens</span>
</div>
<div class="controlGroup">
<button class="actionButton" id="pauseBtn" type="button" aria-pressed="false">Pause motion</button>
<button class="actionButton" id="resetBtn" type="button">Reset scene</button>
</div>
</div>
</section>
<script>
(function(){
"use strict";
const canvas=document.getElementById("fishCanvas"),ctx=canvas.getContext("2d",{alpha:true});
const slider=document.getElementById("fishSlider"),countOut=document.getElementById("fishCount"),pauseBtn=document.getElementById("pauseBtn"),fullBtn=document.getElementById("fullBtn"),resetBtn=document.getElementById("resetBtn"),status=document.getElementById("status");
const lowMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let width=0,height=0,dpr=1,fish=[],paused=lowMotion,last=0,idleTimer=0,statusTimer=0;
if(lowMotion){pauseBtn.textContent="Resume motion";pauseBtn.setAttribute("aria-pressed","true")}
const assetBase = document.querySelector("#reef img").src.replace(/reef\.webp$/, "");
let elapsed = 0;
let dirty = true;
function artwork(name) {
  const img = new Image();
  img.onload = () => { dirty = true; };
  img.src = assetBase + name + ".webp";
  return img;
}
const species = [0, 1, 2, 3].map(i => artwork("fish" + i));
const shells = [artwork("clam0"), artwork("clam1")];
// Tight source bounds keep the visible animal at the requested screen size.
const bounds = [[12,109,603,391],[19,88,589,432],[20,127,579,349],[11,66,595,482]];
const shellBounds = [[18,59,591,515],[6,4,609,577]];
const heroes = [
  {kind:0, size:.225, lane:.34, start:.25, speed:.036, phase:.3},
  {kind:1, size:.163, lane:.56, start:.72, speed:-.029, phase:2},
  {kind:2, size:.132, lane:.66, start:.19, speed:.024, phase:4},
  {kind:3, size:.17, lane:.24, start:.83, speed:-.031, phase:5}
];
function resize() {
  width = innerWidth; height = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); dirty = true;
}
function setCount(n) {
  const target = Math.max(0, Math.min(16, Math.round(Number(n)||0)));
  while (fish.length < target) {
    const i = fish.length;
    fish.push({kind:i%4, size:.055 + .036*Math.random(), lane:.18 + .48*Math.random(),
      start:(.42+i*.618)%1, speed:(i%2?1:-1)*(.016+.011*Math.random()), phase:Math.random()*6.28});
  }
  fish.length = target; dirty = true;
  countOut.value = String(target);
  try { localStorage.setItem("ison.aquarium.fishCount",String(target)); } catch {}
}
function drawSwimmer(f,t) {
  const img = species[f.kind];
  if (!img.naturalWidth) return;
  const [sx,sy,sw,sh] = bounds[f.kind];
  const w = Math.min(width,height*1.98)*f.size, h = w*sh/sw;
  const span = width+w*1.2;
  const x = ((f.start*span+t*f.speed*width)%span+span)%span - w*.6;
  const y = height*(f.lane+.043*Math.sin(t*.17+f.phase)+.015*Math.sin(t*.36+2*f.phase));
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(Math.sign(f.speed),1);
  ctx.rotate(.042*Math.cos(t*.17+f.phase));
  const beat = t*(2.8+f.kind*.42)+f.phase;
  // Oscillation tapers from the caudal fin to the head.
  const strips = 12;
  const edge = u => (u-.5)*w + .052*w*(1-u)**3*Math.sin(beat);
  for (let k=0;k<strips;k++) {
    const u=k/strips, v=(k+1)/strips;
    const lift=.025*h*(1-u)**3*Math.cos(beat);
    ctx.drawImage(img,sx+u*sw,sy,sw/strips,sh,edge(u),-h/2+lift,edge(v)-edge(u)+.45/dpr,h);
  }
  ctx.restore();
}
// The school follows one broad turn, with a slight delay for each follower.
function drawSchool(t) {
  const img = species[0];
  if (!img.naturalWidth) return;
  const [sx, sy, sw, sh] = bounds[0];
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const phase = t * .075 + .32 - i * .043;
    const row = (i % 3) - 1;
    const x = width * (.46 + .35 * Math.sin(phase) + row * .016);
    const y = height * (.41 + .105 * Math.cos(phase) + row * .033 + .008 * Math.sin(t * .85 + i));
    const w = Math.min(width, height * 1.95) * (.036 + (i % 4) * .003);
    const h = w * sh / sw * .78;
    const turn = Math.cos(phase);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale((turn < 0 ? -1 : 1) * (.19 + .81 * Math.abs(turn)), 1);
    ctx.rotate(-.09 * Math.sin(phase) * Math.sign(turn));
    ctx.globalAlpha = .76 + .07 * Math.sin(phase);
    ctx.drawImage(img, sx, sy, sw, sh, -w/2, -h/2, w * (1 + .027*Math.sin(t*4+i)), h);
    ctx.restore();
  }
  ctx.restore();
}
function bubbleArtwork() {
  const stamp = document.createElement("canvas");
  stamp.width = stamp.height = 64;
  const g = stamp.getContext("2d");
  const sheen = g.createRadialGradient(30,29,3,32,32,29);
  sheen.addColorStop(0,"rgba(206,249,255,.04)");
  sheen.addColorStop(.72,"rgba(119,211,234,.10)");
  sheen.addColorStop(.91,"rgba(178,231,245,.44)");
  sheen.addColorStop(1,"rgba(230,254,255,.87)");
  g.fillStyle = sheen;
  g.beginPath(); g.arc(32,32,29,0,Math.PI*2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.92)"; g.lineWidth = 3.4;
  g.beginPath(); g.arc(32,32,23,3.7,4.72); g.stroke();
  return stamp;
}
const bubble = bubbleArtwork();
function drawBubbles(t, shellWidth, bottom) {
  // Derive both the current bubbles and the emission time from scene time so
  // that pause, reset, and reduced motion keep the shell and bubbles in sync.
  const spacing = .39, newest = Math.floor(t / spacing);
  ctx.save();
  for (let i = newest - 20; i <= newest; i++) {
    const born = i * spacing, age = t - born;
    if (Math.cos(born * .27) < -.05) continue;
    const seed = Math.sin(i * 31.77);
    const progress = age / (6.7 + seed);
    if (progress >= 1) continue;
    const drift = Math.sin(age * 1.8 + seed * 4) - Math.sin(seed * 4);
    const x = width*.61 + seed*shellWidth*.065 + width*(.004*drift + .019*progress);
    const y = bottom - shellWidth*.49 - height*.77*progress;
    const size = Math.min(width,height*2)*(.009 + .0035*seed)*(.82 + progress*.5);
    ctx.globalAlpha = .94 * Math.min(1,age*5,(1-progress)*6);
    ctx.drawImage(bubble,x-size/2,y-size/2,size,size);
  }
  ctx.restore();
}
function drawClam(t) {
  const w=Math.min(width*.19,height*.34), x=width*.61-w/2, bottom=height*.94;
  const openness=(1+Math.cos(t*.27))*.5;
  const mix=Math.max(0,Math.min(1,(openness-.22)/.54));
  function shell(i,alpha) {
    if (!shells[i].naturalWidth || !alpha) return;
    const [sx,sy,sw,sh]=shellBounds[i], h=w*sh/sw;
    ctx.globalAlpha=alpha;
    ctx.drawImage(shells[i],sx,sy,sw,sh,x,bottom-h,w,h);
  }
  ctx.save();
  ctx.fillStyle="rgba(16,43,40,.23)";
  ctx.beginPath();ctx.ellipse(x+w*.5,bottom-w*.025,w*.47,w*.066,0,0,Math.PI*2);ctx.fill();
  shell(0,1-mix); shell(1,mix); ctx.restore();
  drawBubbles(t,w,bottom);
}
function frame(now) {
  if (!paused || dirty) {
    if (!paused && last) elapsed+=Math.min((now-last)/1000,.1);
    ctx.clearRect(0,0,width,height);
    drawSchool(elapsed);
    fish.forEach(f => drawSwimmer(f,elapsed));
    drawClam(elapsed);
    heroes.forEach(f => drawSwimmer(f,elapsed));
    dirty=false;
  }
  last=now;
  requestAnimationFrame(frame);
}
function showControls(){document.body.classList.add("controls-visible");clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!document.activeElement||document.activeElement===document.body)document.body.classList.remove("controls-visible")},9000)}
function toast(message){status.textContent=message;status.classList.add("show");clearTimeout(statusTimer);statusTimer=setTimeout(function(){status.classList.remove("show")},1700)}
function togglePause(){paused=!paused;pauseBtn.textContent=paused?"Resume motion":"Pause motion";pauseBtn.setAttribute("aria-pressed",String(paused));toast(paused?"Motion paused":"Motion resumed")}
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();fullBtn.setAttribute("aria-label","Exit full screen")}else{await document.exitFullscreen();fullBtn.setAttribute("aria-label","Enter full screen")}}catch{toast("Full screen isn’t available in this browser")}}
slider.addEventListener("input",function(){setCount(slider.value);showControls()});
pauseBtn.addEventListener("click",togglePause);fullBtn.addEventListener("click",toggleFullscreen);
resetBtn.addEventListener("click",function(){paused=false;pauseBtn.textContent="Pause motion";pauseBtn.setAttribute("aria-pressed","false");elapsed=0;slider.value="8";setCount(8);toast("Aquarium scene reset")});
document.addEventListener("fullscreenchange",function(){fullBtn.setAttribute("aria-label",document.fullscreenElement?"Exit full screen":"Enter full screen")});
window.addEventListener("resize",resize,{passive:true});
document.addEventListener("pointermove",showControls,{passive:true});
document.addEventListener("pointerdown",showControls,{passive:true});
document.addEventListener("keydown",function(e){showControls();if(e.key===" "&&e.target===document.body){e.preventDefault();togglePause()}else if(e.key.toLowerCase()==="f"){e.preventDefault();toggleFullscreen()}else if(e.key==="Escape"||e.key==="Backspace"){if(document.fullscreenElement){document.exitFullscreen()}else if(document.body.classList.contains("controls-visible")){document.body.classList.remove("controls-visible")}else{location.href="screensaver-player.html"}}});
try{const saved=localStorage.getItem("ison.aquarium.fishCount");if(saved!==null)slider.value=saved}catch{}
resize();setCount(slider.value);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
