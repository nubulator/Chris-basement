<!doctype html><meta charset="utf-8"><title>Game storage verification</title><body style="background:#14251e;color:white;font:18px system-ui;padding:30px"><h1>Game storage verification</h1><pre id="results">Running…</pre><button id="reload">Verify after refresh</button><button id="cleanup">Remove test data</button><h2>Existing browser storage sizes (no record contents)</h2><pre id="sizes"></pre><script src="./game-room-storage.js?v=2"></script><script>
const out=document.getElementById('results');out.textContent='';
function log(t){out.textContent+=t+'\n'}
function assert(ok,t){if(!ok)throw Error(t);log('PASS '+t)}
const database='game-storage-verification-20261117';
let a,b;
(async()=>{
 const sizes=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);sizes.push([k,(localStorage.getItem(k)||'').length*2])}sizes.sort((a,b)=>b[1]-a[1]);document.getElementById('sizes').textContent=sizes.map(x=>x[0]+': '+x[1]+' bytes').join('\n');
 if(location.search.includes('reload')){
 a=await GameRoomStorage.open(['record','large','deleted'],{database,legacy:{getItem:()=>null,removeItem(){}}});
 assert(JSON.parse(a.getItem('record')).name==='Test Player','saved player survives refresh');
 assert(a.getItem('large').length===6*1024*1024,'6 MB record survives refresh');
 assert(a.getItem('deleted')===null,'deleted record stays deleted after refresh');
 return;
 }
 await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(database);r.onsuccess=resolve;r.onerror=()=>reject(r.error)});
 const m=new Map([['record',JSON.stringify({name:'Test Player',score:42})],['deleted','old']]);
 const legacy={getItem:k=>m.has(k)?m.get(k):null,removeItem:k=>m.delete(k)};
 a=await GameRoomStorage.open(['record','large','deleted'],{database,legacy});
 assert(a.getItem('record')===JSON.stringify({name:'Test Player',score:42}),'legacy player and score preserved');
 assert(!m.has('record'),'verified old copy reclaimed');
 const backup=await a.backup();assert(backup.legacyBackups.some(x=>x.key==='record'&&JSON.parse(x.value).score===42),'original record archived');
 a.setItem('large','x'.repeat(6*1024*1024));await a.flush();assert(a.getItem('large').length===6*1024*1024,'larger-than-localStorage record committed');
 a.removeItem('deleted');await a.flush();
 b=await GameRoomStorage.open(['record','large','deleted'],{database,legacy});
 assert(b.getItem('deleted')===null,'tombstone retained');
 a.setItem('record',JSON.stringify({name:'Test Player',score:43}));await a.flush();
 b.setItem('record','stale');let rejected=false;try{await b.flush()}catch(e){rejected=true}assert(rejected,'stale tab cannot overwrite newer score');b.close();
 const check=await GameRoomStorage.open(['record'],{database,legacy});
 assert(JSON.parse(check.getItem('record')).score===43,'newer score preserved after rejected save');check.close();
 for(let i=0;i<20;i++)a.setItem('record',JSON.stringify({name:'Test Player',score:44+i}));await a.flush();
const rapid=await GameRoomStorage.open(['record'],{database,legacy});assert(JSON.parse(rapid.getItem('record')).score===63,'rapid saves commit latest state');rapid.close();
const brokenDB=database+'-unavailable';
await new Promise((resolve,reject)=>{const r=indexedDB.open(brokenDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('unrelated');r.onsuccess=()=>{r.result.close();resolve()};r.onerror=()=>reject(r.error)});
const protectedLegacy=new Map([['record','original']]);let failed=false;
try{await GameRoomStorage.open(['record'],{database:brokenDB,legacy:{getItem:k=>protectedLegacy.get(k)||null,removeItem:k=>protectedLegacy.delete(k)}})}catch(e){failed=true}
assert(failed&&protectedLegacy.get('record')==='original','failed storage startup preserves original legacy record');
log('Ready for refresh test.');
})().catch(e=>log('FAIL '+e.stack));
document.getElementById('reload').onclick=()=>location.href=location.pathname+'?reload=1';
document.getElementById('cleanup').onclick=()=>{if(a)a.close();if(b)b.close();const r=indexedDB.deleteDatabase(database);r.onsuccess=()=>log('Test database removed');};
</script></body>
