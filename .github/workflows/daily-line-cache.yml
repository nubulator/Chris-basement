name: Build cached Daily Line feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: daily-line-feed
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate ESPN public data cache
        run: python3 tools/build_daily_line_feed.py
      - name: Commit updated cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-line-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public ESPN Daily Line cache"
            git push
          fi
